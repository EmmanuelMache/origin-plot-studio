# Checks for every pull request and every push to the main lines.
#
# STATUS: a definition. It has not run on GitHub yet; the same commands were run locally (docs/FORTNIGHTLY_CYCLE.md
# says which). It becomes a required check only when the owner makes it one in the branch protection of main.
#
# Safety: the trigger is `pull_request` (never `pull_request_target`), the token can only read, and no secret is
# used anywhere in this file - so a pull request from a fork gets nothing it could leak. Private experimental data
# is not in the repository (.gitignore) and no step fetches any; the first job fails if such a file is tracked.
#
# Linux, Qt in "offscreen" mode. This does not replace a smoke test on Windows, and nothing here can exercise
# OriginPro itself: both remain manual steps before a release.
name: CI

on:
  pull_request:
  push:
    branches: [main, "integrate/**"]
  workflow_dispatch:            # also the way to run the checks on a cycle/<id> branch (see docs/FORTNIGHTLY_CYCLE.md)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"        # the Python the lock file was made and tested with (origin_plot_app/requirements.lock)
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg
  OPS_NO_OPEN: "1"

jobs:
  static:
    name: Static checks and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: No private or personal file is tracked
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '^(sample_data|ops_private|my_templates|screenshots|converted_tables|examples_your_data|origin_plot_app/examples_your_data|origin_plot_app/converted_tables)/|\.(opju|opj)$|(^|/)(settings|settings_modern|last_session)\.json$|(^|/)secrets\.dat$|(^|/)\.env$' || true)
          if [ -n "$bad" ]; then
            echo "::error title=Private file in the repository::$(printf '%s' "$bad" | wc -l | tr -d ' ') tracked file(s) belong to the private or personal sets named in .gitignore."
            exit 1
          fi
      - name: Every Python file compiles
        run: python -m compileall -q origin_plot_app tools tests
      - name: Secret scan of the checked-out tree
        run: python3 tools/secret_scan.py .
      - name: Requirements are exact pins and the lock matches them
        run: python3 tools/dependency_inventory.py --check
      - name: The automation is what it says (cadence gate, evidence bundle, workflow files)
        run: |
          set -euo pipefail
          python3 tests/test_cycle_due.py
          python3 tests/test_workflows_static.py

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # pip-audit is a tool of this job only; it is not installed into the environment the app is tested in.
      - name: Known vulnerabilities in the locked set
        run: |
          set -euo pipefail
          python -m pip install --quiet pip-audit==2.10.1
          python -m pip_audit -r origin_plot_app/requirements.lock --disable-pip --progress-spinner off

  tests:
    name: Tests (group ${{ matrix.group }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: origin_plot_app/requirements.lock
      # What Qt needs to start without a display on Ubuntu: EGL/OpenGL, keyboard maps, D-Bus, fontconfig and one font.
      - name: System libraries for Qt offscreen
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - name: Install the locked dependency set (hashes checked)
        run: "python -m pip install --require-hashes --only-binary :all: -r origin_plot_app/requirements.lock"
      # The tests are plain scripts: each prints PASS / FAIL lines and ends with exit code 1 when a check failed.
      # They are dealt out to four groups by their position in the sorted list. No test is left out.
      - name: Run this group
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -uo pipefail
          i=0; ran=0; failed=()
          for f in $(ls tests/test_*.py | sort); do
            mine=$(( i % 4 )); i=$(( i + 1 ))
            if [ "$mine" -ne "$GROUP" ]; then continue; fi
            echo "::group::$f"
            timeout 1500 python3 "$f"; rc=$?
            echo "::endgroup::"
            ran=$(( ran + 1 ))
            if [ "$rc" -ne 0 ]; then failed+=("$f (exit code $rc)"); echo "::error title=Test failed::$f ended with exit code $rc"; fi
          done
          {
            echo "### Tests, group $GROUP: $ran file(s) run, ${#failed[@]} failed"
            for f in "${failed[@]}"; do echo "- FAILED: $f"; done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ran" -eq 0 ]; then echo "::error::no test file was found for this group"; exit 1; fi
          [ "${#failed[@]}" -eq 0 ]
