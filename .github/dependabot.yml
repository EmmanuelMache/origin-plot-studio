# Dependabot: proposes updates as pull requests, once a week, a few at a time. It merges nothing.
#
# STATUS: a definition. Dependabot reads this file from the default branch, and version updates work only when the
# owner has switched Dependabot on for the repository (Settings > Code security). Until then nothing is opened.
#
# A pull request for the Python packages changes origin_plot_app/requirements.txt only. The lock with the hashes
# (requirements.lock) is NOT regenerated by Dependabot: do that by hand (python tools/dependency_inventory.py --lock),
# run the tests, and commit the lock to the same pull request. CI fails until the two files agree
# (tools/dependency_inventory.py --check), so an update cannot slip in half done.
# Updates of GitHub Actions keep the pinned commit and its version comment in step.
version: 2
updates:
  - package-ecosystem: pip
    directory: /origin_plot_app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 3
    labels: []
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 3
    labels: []
    commit-message:
      prefix: actions
